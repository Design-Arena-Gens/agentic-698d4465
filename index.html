<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agentic Cat Parade</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="stage">
      <header class="header">
        <h1>Agentic Cat Parade</h1>
        <p>Tap the spotlight to send the cat sprinting across the skyline.</p>
        <button id="toggle-button" aria-label="Toggle cat speed">
          Start Sprint
        </button>
      </header>
      <section class="scene">
        <div class="skyline">
          <div class="building building-short"></div>
          <div class="building building-tall"></div>
          <div class="building building-mid"></div>
          <div class="building building-tall"></div>
          <div class="building building-short"></div>
        </div>
        <div class="spotlight"></div>
        <div class="cat" role="img" aria-label="A cat running across rooftops">
          <div class="ear left"></div>
          <div class="ear right"></div>
          <div class="face">
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="whisker left whisker-top"></div>
            <div class="whisker left whisker-bottom"></div>
            <div class="whisker right whisker-top"></div>
            <div class="whisker right whisker-bottom"></div>
          </div>
          <div class="body">
            <div class="leg front"></div>
            <div class="leg back"></div>
          </div>
          <div class="tail"></div>
        </div>
      </section>
    </main>
    <script src="/script.js" type="module"></script>
  </body>
</html>
